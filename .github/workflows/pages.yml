name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare publish-only directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-site
          for file in index.html styles.css script.js site.webmanifest robots.txt sitemap.xml; do
            if [ -f "$file" ]; then
              cp -- "$file" public-site/
            fi
          done
          if [ -d assets ]; then
            cp -R -- assets public-site/
          fi
          test -s public-site/index.html
          test -s public-site/styles.css
          test -s public-site/script.js
          echo "Files prepared for public deployment:"
          find public-site -type f -print

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
